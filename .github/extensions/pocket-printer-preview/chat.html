<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Printer V2</title>
  <link rel="stylesheet" href="chat.css">
  <script type="module" src="chat.js"></script>
</head>
<body>
  <main>
    <header><h1>Pocket Printer</h1><span>CHAT TO PRINT</span></header>
    <p class="muted">Describe your text or checklist in Copilot chat. Ask there for changes.</p>
    <div id="error" role="alert" hidden></div>
    <section aria-label="Print preview">
      <p id="preview-status" role="status">Waiting for content from chat.</p>
      <div id="preview"></div>
      <p id="metadata" class="muted"></p>
    </section>
    <section aria-label="Printer">
      <div class="row"><button id="scan">Find printer</button><button id="stop" hidden>Stop scan</button></div>
      <label for="target">Printer</label>
      <select id="target"><option value="">Select a discovered printer</option></select>
      <p id="scan-status" class="muted"></p>
      <p id="ready" role="status"></p>
      <div class="row"><button id="print" class="primary" disabled>Print</button><button id="refresh">Refresh preview</button></div>
      <p id="job" role="status"></p>
      <button id="status" hidden>Check print status</button>
    </section>
  </main>
</body>
</html>
